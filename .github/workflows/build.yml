# This workflow is managed by gh actions-lock.

name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.4.0
      - name: Setup java
        uses: actions/setup-java@v4.9.1
        with:
          distribution: 'zulu'
          java-version: |
            17
            25
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build
